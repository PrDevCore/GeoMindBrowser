<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Gradient accent -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Browser window body -->
  <rect x="104" y="104" width="304" height="304" rx="32" fill="white" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Traffic light dots -->
  <circle cx="156" cy="156" r="10" fill="#ef4444"/>
  <circle cx="256" cy="156" r="10" fill="#3b82f6"/>
  <circle cx="356" cy="156" r="10" fill="#22c55e"/>

  <!-- Address bar -->
  <rect x="136" y="220" width="240" height="28" rx="14" fill="#f1f5f9" stroke="url(#accent)" stroke-width="3"/>

  <!-- Route lines (representing navigation/waypoints) -->
  <g stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Path 1 -->
    <path d="M 176 252 L 200 280 L 230 252 L 260 280 L 290 252 L 320 280" fill="none"/>
    <!-- Path 2 (offset) -->
    <path d="M 176 300 L 200 328 L 230 300 L 260 328 L 290 300 L 320 328" fill="none" opacity="0.4"/>
  </g>

  <!-- Arrow head on route -->
  <polygon points="330,310 300,300 322,330" fill="url(#accent)"/>

  <!-- Compass needle (geographic theme) -->
  <g transform="translate(360, 200)">
    <!-- Circular ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.8"/>
    <!-- Arrow pointing up-right -->
    <path d="M -8 -12 L 12 0 L -4 10 Z" fill="url(#accent)"/>
    <!-- Dot at center -->
    <circle cx="0" cy="0" r="3" fill="white"/>
  </g>

  <!-- Subtle glow on outer corner -->
  <rect x="80" y="80" width="352" height="352" rx="96" fill="white" opacity="0.08"/>
</svg>