name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject committed env, key, and model files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env$|\.(pem|key|p12|pfx|gguf)$' || true)"
          if [ -n "$bad" ]; then
            echo "Forbidden file types are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: Reject private key material
        shell: bash
        run: |
          set -euo pipefail
          hits="$(git grep -n -I -E 'BEGIN ([A-Z]+ )?PRIVATE KEY' -- . ':(exclude).github/**' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi
      - name: Validate tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done < <(git ls-files -z '*.json')

  extension:
    name: extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present

  web-client:
    name: web-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build

  companion:
    name: companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache: true
          cache-dependency-path: companion/go.sum
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Test
        run: go test -race ./...

  session:
    name: session control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: session/go.mod
          cache: true
          cache-dependency-path: session/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Test
        run: go test -race ./...

  leak:
    name: leak suite
    needs: companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache: true
          cache-dependency-path: companion/go.sum
      - name: Companion fail-closed checks
        run: bash tests/leak/companion/run.sh
      - name: Build tunnel test binary
        shell: bash
        run: cd companion && go test -c -o "$RUNNER_TEMP/tunnel.test" ./internal/tunnel
      - name: Ensure capture tools
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo sh -c 'command -v tcpdump' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends tcpdump
          fi
      - name: Network-namespace WireGuard capture
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/wg-capture.log"
          # The runner executes this with `bash -e`, so a bare failing command would
          # abort before the diagnostics below ever ran. `|| status=$?` is what keeps
          # the capture output observable; run 41501157369 lost its annotations exactly
          # this way.
          status=0
          sudo env PATH="$PATH" LEAK_REQUIRE_NETNS=1 LEAK_TUNNEL_TEST="$RUNNER_TEMP/tunnel.test" \
            bash tests/leak/wg/run.sh >"$log" 2>&1 || status=$?
          cat "$log"
          # Job logs need a GitHub sign-in to read; annotations do not, and a check run
          # publishes only its first ten, so these lines are the diagnosis that survives
          # to the anonymous API. Percent signs are doubled first so a captured packet
          # line cannot forge a workflow command.
          if [ "$status" -ne 0 ]; then
            clean() { sed 's/%/%25/g' | tr -d '\r'; }
            printf '::error::netns capture exited %s\n' "$status"
            (grep -E 'FAIL:|skip:|panic:|--- FAIL|not found|exit status' "$log" || true) |
              clean | head -n 4 |
              while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            tail -n 2 "$log" | clean |
              while IFS= read -r line; do printf '::error::tail: %s\n' "$line"; done
          fi
          exit "$status"
      - name: Browser PAC and fail-closed checks
        run: |
          set -euo pipefail
          if [ ! -d node_modules/@playwright ]; then
            echo "SKIP: the browser stage needs npm ci and a Chromium install; it runs locally"
          else
            npm run test:browser
          fi
